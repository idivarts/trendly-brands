name: Deploy Trendly Brands

on:
  push:
    branches:
      - master
      - dev

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    strategy:
      matrix:
        node-version: [20.x]

    env:
      # Decide env/stage based on branch
      STAGE: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        ssh-key: ${{ secrets.GIT_SSH_KEY }}

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - run: npm install

    - name: Load Config JS
      env:
        FIREBASE_CONFIG_BASE64: ${{ secrets.TRENDLY_BRANDS_FIREBASE_CONFIG }}
        ENV_LOCAL_BASE64: ${{ secrets.ENV_LOCAL_FILE }}
      run: |
        echo $FIREBASE_CONFIG_BASE64 | base64 -d > firebase-config.js
        echo $ENV_LOCAL_BASE64 | base64 -d > .env.local

    - name: Build Web
      env:
        EXPO_PUBLIC_APP_STAGE: ${{ env.STAGE }}
        EXPO_PUBLIC_WEBSOCKET_TRENDLY: ${{ env.STAGE == 'prod' && vars.WEBSOCKET_PROD_TRENDLY || vars.WEBSOCKET_DEV_TRENDLY }}
        EXPO_PUBLIC_FIRESTORE_DATABASE_ID: ${{ env.STAGE == 'prod' && vars.FIRESTORE_DATABASE_PROD_ID || vars.FIRESTORE_DATABASE_DEV_ID }}
        # PostHog has no environment dimension — its guidance is a separate
        # PROJECT per environment, so the key IS the dev/prod separation.
        EXPO_PUBLIC_POSTHOG_KEY: ${{ env.STAGE == 'prod' && vars.POSTHOG_KEY_PROD || vars.POSTHOG_KEY_DEV }}
        EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        # One Sentry project, segmented by its first-class `environment`
        # field (set from EXPO_PUBLIC_APP_STAGE) — so a single DSN. Not a
        # secret: a client DSN ships inside the bundle either way.
        EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_BRANDS }}
        # Marketing pixel IDs — public identifiers, so variables not secrets.
        # Bundle-only (MarketingPixels), so they do not affect the fingerprint.
        EXPO_PUBLIC_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
        EXPO_PUBLIC_GOOGLE_ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
        EXPO_PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.LINKEDIN_PARTNER_ID }}
        EXPO_PUBLIC_TWITTER_PIXEL_ID: ${{ vars.TWITTER_PIXEL_ID }}
        EXPO_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
      run: |
        set -euo pipefail
        # Expo's own dotenv loader does not override an already-set variable, so
        # the web build was never mis-staged the way the native ones were. Run
        # the sanitizer anyway: it keeps every consumer of ENV_LOCAL_FILE on the
        # same rule, and surfaces the same drift warning.
        ./scripts/sanitize-env-local.sh
        npm run build

    - name: Deploy with Serverless
      uses: serverless/github-action@v3.2
      with:
        args: >
          deploy
          --stage ${{ env.STAGE }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # ── Stop the app shell being cached across a deploy ──────────────────────
    #
    # Nothing was setting Cache-Control on anything: `aws s3api head-object` on
    # index.html and on the entry bundle both returned `CacheControl: null`.
    # With no Cache-Control a browser falls back to HEURISTIC caching, holding
    # the HTML for roughly a tenth of its age — hours, a day after a deploy.
    #
    # That is fatal here specifically because this is a single-page app whose
    # script is CONTENT-HASHED. Every deploy emits a new `entry-<hash>.js` and
    # deletes the old one, so a browser still holding yesterday's shell asks
    # for a bundle that no longer exists, gets a 404, and renders NOTHING: a
    # white page, an empty <div id="root">, no console error worth the name and
    # no Sentry event, because a 404 on a <script> is a silent network failure.
    # It is per-URL, because the cache entry is — which is why it presents as
    # "one page is blank and the rest are fine" rather than as an outage.
    #
    # Caught on dev on 12 Nov: one Design Studio URL was blank on every cold
    # load while two others were fine, and the same URL rendered perfectly with
    # a cache-busting query string.
    #
    # Only index.html is touched, and deliberately:
    #   • It is the ONLY html object — Lift's single-page-app rewrites every
    #     404 to it, which is why /design-studio/<id> serves the same 1,233
    #     bytes as /. One object, so no recursive copy and no chance of
    #     flattening every asset's Content-Type, which a `cp --recursive
    #     --metadata-directive REPLACE` would do.
    #   • The hashed assets under /_expo are safe to cache heuristically: their
    #     names change when their contents do, so a stale one is never asked
    #     for once the shell revalidates. Marking them `immutable` is a real
    #     improvement but needs a per-file Content-Type pass; it is not
    #     smuggled in here.
    #
    # The invalidation is for the EDGE, so CloudFront serves the new metadata
    # at once. It cannot reach a browser cache: anyone already holding a stale
    # shell stays broken until their heuristic TTL lapses or they hard-reload.
    # This stops the next deploy doing it again, it does not undo the last one.
    - name: Make the app shell revalidate
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        set -euo pipefail
        STACK="trendly-brands-${STAGE}"
        outputs() {
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
        }
        BUCKET=$(outputs trendlyBrandsBucketName01B9621F)
        DIST=$(outputs trendlyBrandsDistributionIdF8511D14)
        if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
          echo "::error::could not resolve the site bucket from $STACK — the Lift output key may have changed"
          exit 1
        fi
        echo "shell: s3://$BUCKET/index.html  ·  distribution: $DIST"
        aws s3 cp "s3://$BUCKET/index.html" "s3://$BUCKET/index.html" \
          --metadata-directive REPLACE \
          --content-type "text/html" \
          --cache-control "no-cache"
        if [ -n "$DIST" ] && [ "$DIST" != "None" ]; then
          aws cloudfront create-invalidation --distribution-id "$DIST" \
            --paths "/" "/index.html" >/dev/null
        fi
        aws s3api head-object --bucket "$BUCKET" --key index.html \
          --query "{CacheControl:CacheControl,ContentType:ContentType}" --output json