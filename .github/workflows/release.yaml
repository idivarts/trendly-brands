name: Mobile Release (OTA or Native)

# On every push to dev/master this decides, per platform, whether the change is
# JS-only (-> publish an EAS Update) or native-affecting.
#
# What happens on a native-affecting change differs by branch:
#   dev    -> build + submit inline, via native-build.yaml (fast iteration)
#   master -> allocate a release tag (vX.Y.Z, vX.Y.Z-2, ...) and stop. Pushing
#             that tag triggers native-release.yaml, which does the build.
#
# The master indirection exists so a native build is always pinned to a tag,
# and so a tag can be cut by hand at any time to seal the current JS bundle
# into a fresh binary — even when no native change is pending.
#
# The decision compares the expo-updates fingerprint of HEAD against the
# fingerprint of the last natively-built-and-submitted commit, which is stored
# in annotated git tags (the "ledger"):
#   ota-base-ios-dev  ota-base-android-dev  ota-base-ios-prod  ota-base-android-prod
#
# Shared with native-release.yaml, so neither drifts from the other:
#   resolve-runtime.yaml  — what runtimeVersion does this commit produce
#   native-build.yaml     — build a store binary and ship it
#
# Deliberately NO `tags:` trigger — this workflow pushes both ledger and release
# tags, and a tag trigger here would make it re-enter itself.

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      force_native:
        description: 'Force a native build + submit regardless of fingerprint'
        type: boolean
        default: false

concurrency:
  # Never cancel a master run mid-submit; dev runs may stack up, so drop stale ones.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write

# Needed by the `ota` job below, which bundles JS and re-resolves runtimeVersions.
# The reusable workflows declare this block themselves — a caller's workflow-level
# env does NOT propagate into a called workflow.
env:
  EXPO_PUBLIC_BRANCH_LIVE_KEY: ${{ vars.BRANCH_LIVE_KEY }}
  EXPO_PUBLIC_BRANCH_TEST_KEY: ${{ vars.BRANCH_TEST_KEY }}
  EXPO_PUBLIC_BRANCH_LIVE_DOMAIN: ${{ vars.BRANCH_LIVE_DOMAIN }}
  EXPO_PUBLIC_BRANCH_TEST_DOMAIN: ${{ vars.BRANCH_TEST_DOMAIN }}

jobs:
  resolve:
    uses: ./.github/workflows/resolve-runtime.yaml
    with:
      stage: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    secrets: inherit

  decide:
    name: Decide OTA vs native
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    outputs:
      stage: ${{ steps.ctx.outputs.stage }}
      channel: ${{ steps.ctx.outputs.channel }}
      ios_native: ${{ steps.cmp.outputs.ios_native }}
      android_native: ${{ steps.cmp.outputs.android_native }}
      ota_platform: ${{ steps.cmp.outputs.ota_platform }}
      release_tag_needed: ${{ steps.cmp.outputs.release_tag_needed }}
    steps:
      # No npm install here: the fingerprints already came from `resolve`, so
      # this job only needs git tags and jq.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GIT_SSH_KEY }}
          fetch-depth: 0 # full history + tags; the ledger needs them

      - name: Resolve stage / channel
        id: ctx
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "stage=prod"          >> "$GITHUB_OUTPUT"
            echo "channel=production"  >> "$GITHUB_OUTPUT"
          else
            echo "stage=dev"           >> "$GITHUB_OUTPUT"
            echo "channel=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Read ledger and decide
        id: cmp
        env:
          STAGE: ${{ steps.ctx.outputs.stage }}
          RTV_IOS: ${{ needs.resolve.outputs.rtv_ios }}
          RTV_ANDROID: ${{ needs.resolve.outputs.rtv_android }}
          FORCE_NATIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_native || false }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet origin

          ledger_rtv () { # $1 = platform
            git for-each-ref --format='%(contents)' "refs/tags/ota-base-$1-$STAGE" \
              | head -n1 | jq -r '.runtimeVersion // empty' 2>/dev/null || true
          }

          need () { # $1 = platform, $2 = current rtv
            local have; have="$(ledger_rtv "$1")"
            if   [ "$FORCE_NATIVE" = "true" ]; then echo true
            elif [ -z "$have" ];               then echo true   # bootstrap: no ledger yet
            elif [ "$have" != "$2" ];          then echo true
            else                                    echo false
            fi
          }

          IOS_N="$(need ios "$RTV_IOS")"
          AND_N="$(need android "$RTV_ANDROID")"

          if   [ "$IOS_N" = false ] && [ "$AND_N" = false ]; then OTA=all
          elif [ "$IOS_N" = false ];                         then OTA=ios
          elif [ "$AND_N" = false ];                         then OTA=android
          else                                                   OTA=none
          fi

          # On master a native change does NOT build here — it allocates a release
          # tag, and native-release.yaml builds from that tag. Skip the tag if an
          # existing release tag already covers this exact fingerprint pair, so a
          # second merge landing while a build is in flight can't double-tag.
          TAG_NEEDED=false
          if [ "$STAGE" = "prod" ] && { [ "$IOS_N" = true ] || [ "$AND_N" = true ]; }; then
            TAG_NEEDED=true
            # force_native means "cut a release regardless", so it skips this check.
            if [ "$FORCE_NATIVE" != "true" ]; then
              for t in $(git tag -l 'v*'); do
                m="$(git for-each-ref --format='%(contents)' "refs/tags/$t" | head -n1)"
                ti="$(jq -r '.iosRuntimeVersion // empty'     <<<"$m" 2>/dev/null || true)"
                ta="$(jq -r '.androidRuntimeVersion // empty' <<<"$m" 2>/dev/null || true)"
                if [ "$ti" = "$RTV_IOS" ] && [ "$ta" = "$RTV_ANDROID" ]; then
                  echo "::notice::release tag $t already covers this fingerprint pair; not tagging again"
                  TAG_NEEDED=false
                  break
                fi
              done
            fi
          fi

          {
            echo "ios_native=$IOS_N"
            echo "android_native=$AND_N"
            echo "ota_platform=$OTA"
            echo "release_tag_needed=$TAG_NEEDED"
          } >> "$GITHUB_OUTPUT"

          if [ "$STAGE" = "prod" ]; then
            native_action="tag for release (built by native-release.yaml)"
          else
            native_action="NATIVE build+submit"
          fi

          {
            echo "## Release decision — stage \`$STAGE\`"
            echo ""
            echo "| platform | HEAD runtimeVersion | ledger runtimeVersion | action |"
            echo "|---|---|---|---|"
            echo "| ios | \`$RTV_IOS\` | \`$(ledger_rtv ios)\` | $([ "$IOS_N" = true ] && echo "$native_action" || echo 'OTA') |"
            echo "| android | \`$RTV_ANDROID\` | \`$(ledger_rtv android)\` | $([ "$AND_N" = true ] && echo "$native_action" || echo 'OTA') |"
            echo ""
            echo "OTA platform scope: \`$OTA\`"
            if [ "$STAGE" = "prod" ]; then echo "Release tag needed: \`$TAG_NEEDED\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  ota:
    name: Publish OTA update
    needs: [resolve, decide]
    if: needs.decide.outputs.ota_platform != 'none'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.GIT_SSH_KEY }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm install -g eas-cli@16.28.0 # pinned: unpinned would jump majors silently
      - run: npm ci

      - name: Load Config JS
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.TRENDLY_BRANDS_FIREBASE_CONFIG }}
          ENV_LOCAL_BASE64: ${{ secrets.ENV_LOCAL_FILE }}
          ANDROID_FIREBASE_CONFIG_BASE64: ${{ secrets.ANDROID_FIREBASE_CONFIG }}
          IOS_FIREBASE_CONFIG_BASE64: ${{ secrets.IOS_FIREBASE_CONFIG }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_CONFIG_BASE64"         | base64 -d > firebase-config.js
          echo "$ENV_LOCAL_BASE64"               | base64 -d > .env.local
          echo "$ANDROID_FIREBASE_CONFIG_BASE64" | base64 -d > google-services.json
          echo "$IOS_FIREBASE_CONFIG_BASE64"     | base64 -d > GoogleService-Info.plist

      - name: Re-assert runtime versions before publishing
        env:
          # Same stage as the resolve job, or this check compares two different
          # resolutions and passes while the real build diverges.
          EXPO_PUBLIC_APP_STAGE: ${{ needs.decide.outputs.stage }}
          OTA_PLATFORM: ${{ needs.decide.outputs.ota_platform }}
          RTV_IOS: ${{ needs.resolve.outputs.rtv_ios }}
          RTV_ANDROID: ${{ needs.resolve.outputs.rtv_android }}
        run: |
          set -euo pipefail
          check () {
            local got
            got="$(npx expo-updates runtimeversion:resolve --platform "$1" | jq -r .runtimeVersion)"
            [ "$got" = "$2" ] || { echo "::error::$1 runtimeVersion drifted: $got != $2"; exit 1; }
            echo "$1 runtimeVersion confirmed: $got"
          }
          [ "$OTA_PLATFORM" = android ] || check ios     "$RTV_IOS"
          [ "$OTA_PLATFORM" = ios     ] || check android "$RTV_ANDROID"

      # ── The bundle env. Keep in sync with the build step in native-build.yaml. ──
      - name: Publish OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_CHANNEL: ${{ needs.decide.outputs.channel }}
          OTA_PLATFORM: ${{ needs.decide.outputs.ota_platform }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          # Must match the native build jobs exactly — these are baked into the
          # bundle, so any divergence silently swaps DB/websocket/IAP config.
          EXPO_PUBLIC_APP_STAGE: ${{ needs.decide.outputs.stage }}
          EXPO_PUBLIC_WEBSOCKET_TRENDLY: ${{ needs.decide.outputs.stage == 'prod' && vars.WEBSOCKET_PROD_TRENDLY || vars.WEBSOCKET_DEV_TRENDLY }}
          EXPO_PUBLIC_FIRESTORE_DATABASE_ID: ${{ needs.decide.outputs.stage == 'prod' && vars.FIRESTORE_DATABASE_PROD_ID || vars.FIRESTORE_DATABASE_DEV_ID }}
          # PostHog has no environment dimension — its guidance is a separate
          # PROJECT per environment, so the key IS the dev/prod separation.
          EXPO_PUBLIC_POSTHOG_KEY: ${{ needs.decide.outputs.stage == 'prod' && vars.POSTHOG_KEY_PROD || vars.POSTHOG_KEY_DEV }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # One Sentry project, segmented by its first-class `environment`
          # field (set from EXPO_PUBLIC_APP_STAGE) — so a single DSN. Not a
          # secret: a client DSN ships inside the bundle either way.
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_BRANDS }}
          # Marketing pixel IDs — public identifiers, so variables not secrets.
          # Bundle-only (MarketingPixels), so they do not affect the fingerprint.
          EXPO_PUBLIC_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          EXPO_PUBLIC_GOOGLE_ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          EXPO_PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.LINKEDIN_PARTNER_ID }}
          EXPO_PUBLIC_TWITTER_PIXEL_ID: ${{ vars.TWITTER_PIXEL_ID }}
          EXPO_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ vars.REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
        run: |
          set -euo pipefail
          OTA_MESSAGE="${GITHUB_SHA:0:7} $(head -n1 <<<"${HEAD_COMMIT_MESSAGE:-manual dispatch}")"
          export OTA_MESSAGE
          npm run ota-publish

      - name: Verify published runtime version
        env:
          RTV_IOS: ${{ needs.resolve.outputs.rtv_ios }}
          RTV_ANDROID: ${{ needs.resolve.outputs.rtv_android }}
        run: |
          set -euo pipefail
          cat ota-result.json
          # Shape confirmed against eas-cli 16.28.0: a flat array of update
          # objects, one per platform, each carrying `platform` + `runtimeVersion`.
          # The `found` guard catches a future shape change, which would otherwise
          # make this loop iterate zero times and pass vacuously.
          found=0
          while read -r p r; do
            case "$p" in
              ios)     exp="$RTV_IOS" ;;
              android) exp="$RTV_ANDROID" ;;
              *)       continue ;;
            esac
            [ "$r" = "$exp" ] || { echo "::error::published $p runtimeVersion $r != expected $exp"; exit 1; }
            echo "verified $p @ $r"
            found=$((found + 1))
          done < <(jq -r '.[] | select(has("platform") and has("runtimeVersion"))
                          | "\(.platform) \(.runtimeVersion)"' ota-result.json | sort -u)
          [ "$found" -gt 0 ] || { echo "::error::could not read any platform/runtimeVersion from ota-result.json"; exit 1; }

      - name: Summarize
        run: |
          {
            echo "## OTA published"
            echo "- channel: \`${{ needs.decide.outputs.channel }}\`"
            echo "- platform: \`${{ needs.decide.outputs.ota_platform }}\`"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # dev only: on master a native change is tagged instead, and native-release.yaml
  # builds it. stage/channel are literals here because of that gate.
  android-native:
    name: Android
    needs: [resolve, decide]
    if: needs.decide.outputs.android_native == 'true' && needs.decide.outputs.stage == 'dev'
    uses: ./.github/workflows/native-build.yaml
    with:
      platform: android
      stage: dev
      channel: development
      expected_runtime_version: ${{ needs.resolve.outputs.rtv_android }}
    secrets: inherit

  ios-native:
    name: iOS
    needs: [resolve, decide]
    if: needs.decide.outputs.ios_native == 'true' && needs.decide.outputs.stage == 'dev'
    uses: ./.github/workflows/native-build.yaml
    with:
      platform: ios
      stage: dev
      channel: development
      expected_runtime_version: ${{ needs.resolve.outputs.rtv_ios }}
    secrets: inherit

  tag-release:
    name: Allocate release tag
    needs: [resolve, decide]
    # master only. Creating the tag is the handoff: pushing it triggers
    # native-release.yaml, which builds and submits both platforms.
    if: needs.decide.outputs.stage == 'prod' && needs.decide.outputs.release_tag_needed == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GIT_SSH_KEY }}
          fetch-depth: 0

      - name: Create and push release tag
        env:
          RTV_IOS: ${{ needs.resolve.outputs.rtv_ios }}
          RTV_ANDROID: ${{ needs.resolve.outputs.rtv_android }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet origin

          BASE="v$(jq -r '.expo.version' app.json)"
          if ! git rev-parse -q --verify "refs/tags/$BASE" >/dev/null; then
            TAG="$BASE"
          else
            n=2
            while git rev-parse -q --verify "refs/tags/$BASE-$n" >/dev/null; do n=$((n + 1)); done
            TAG="$BASE-$n"
          fi

          # Fingerprints live in the tag message so `decide` can tell that a tag
          # already covers this build and avoid double-tagging on a later merge.
          MSG="$(jq -nc \
            --arg ios "$RTV_IOS" --arg android "$RTV_ANDROID" \
            --arg sha "$GITHUB_SHA" --arg ver "$(jq -r '.expo.version' app.json)" \
            --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{iosRuntimeVersion:$ios,androidRuntimeVersion:$android,commit:$sha,appVersion:$ver,runId:$run,createdAt:$at}')"

          git config user.name  "trendly-ci"
          git config user.email "ci@trendly.pro"
          git tag -a "$TAG" -m "$MSG" "$GITHUB_SHA"
          # No -f: a name collision here means the allocation raced, and failing
          # loudly is better than clobbering someone else's release tag.
          git push origin "refs/tags/$TAG"

          {
            echo "## Release tag created"
            echo ""
            echo "- tag: \`$TAG\`"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
            echo "- ios runtimeVersion: \`$RTV_IOS\`"
            echo "- android runtimeVersion: \`$RTV_ANDROID\`"
            echo ""
            echo "\`native-release.yaml\` will build and submit both platforms from this tag."
          } >> "$GITHUB_STEP_SUMMARY"
